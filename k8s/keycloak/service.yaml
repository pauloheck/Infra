###############################################################################
# Service — Keycloak (ClusterIP interno)
# Acesso interno: http://keycloak.keycloak.svc.cluster.local:8080
###############################################################################
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080

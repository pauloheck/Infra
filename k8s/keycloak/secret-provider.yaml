###############################################################################
# SecretProviderClass — Keycloak
# KV: kv-keycloak-dev  (criar via Terraform antes de aplicar)
# Secrets necessários no KV:
#   keycloak-admin-password   → senha do admin Keycloak
#   keycloak-db-password      → senha do usuário 'keycloak' no PostgreSQL
# userAssignedIdentityID: preencher com o MI do node pool após terraform apply
###############################################################################
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: keycloak-kv-secrets
  namespace: keycloak
spec:
  provider: azure
  parameters:
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "REPLACE_WITH_KUBELET_MI_CLIENT_ID"
    keyvaultName: "kv-keycloak-dev"
    objects: |
      array:
        - |
          objectName: keycloak-admin-password
          objectType: secret
        - |
          objectName: keycloak-db-password
          objectType: secret
    tenantId: "7377a982-cbdf-40d4-af3d-281d65c00164"
  secretObjects:
    - secretName: keycloak-secrets
      type: Opaque
      data:
        - objectName: keycloak-admin-password
          key: KEYCLOAK_ADMIN_PASSWORD
        - objectName: keycloak-db-password
          key: KC_DB_PASSWORD

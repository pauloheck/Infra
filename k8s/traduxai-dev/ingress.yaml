apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traduxai-ingress
  namespace: traduxai-dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: traduxai-heck.eastus2.cloudapp.azure.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: traduxai-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traduxai-web
                port:
                  number: 80
    - host: traduxai.heck.app
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: traduxai-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traduxai-web
                port:
                  number: 80
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traduxai-web
                port:
                  number: 80

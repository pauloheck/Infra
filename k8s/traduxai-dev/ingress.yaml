apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traduxai-ingress
  namespace: traduxai-dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - traduxai-heck.eastus2.cloudapp.azure.com
      secretName: traduxai-tls
  rules:
    - host: traduxai-heck.eastus2.cloudapp.azure.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: traduxai-api
                port:
                  number: 8010
          - path: /api/docs
            pathType: Prefix
            backend:
              service:
                name: traduxai-api
                port:
                  number: 8010
          - path: /api/redoc
            pathType: Prefix
            backend:
              service:
                name: traduxai-api
                port:
                  number: 8010
          - path: /api/openapi.json
            pathType: Prefix
            backend:
              service:
                name: traduxai-api
                port:
                  number: 8010
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: traduxai-keycloak
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traduxai-web
                port:
                  number: 3000
    # Catch-all sem host: Azure LB health probe (sem Host header)
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traduxai-web
                port:
                  number: 3000

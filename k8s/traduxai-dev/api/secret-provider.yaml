apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: traduxai-kv-secrets
  namespace: traduxai-dev
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "cae30d67-c70e-4029-a562-40fbdf107001"
    keyvaultName: "kv-traduxai-dev"
    tenantId: "7377a982-cbdf-40d4-af3d-281d65c00164"
    objects: |
      array:
        - |
          objectName: traduxai-postgres-url
          objectType: secret
        - |
          objectName: traduxai-appinsights
          objectType: secret
        - |
          objectName: traduxai-keycloak-url
          objectType: secret
        - |
          objectName: traduxai-keycloak-issuer
          objectType: secret
        - |
          objectName: traduxai-keycloak-client-secret
          objectType: secret
        - |
          objectName: traduxai-nextauth-secret
          objectType: secret
        - |
          objectName: traduxai-openai-endpoint
          objectType: secret
        - |
          objectName: traduxai-openai-key
          objectType: secret
        - |
          objectName: traduxai-translator-endpoint
          objectType: secret
        - |
          objectName: traduxai-translator-key
          objectType: secret
        - |
          objectName: traduxai-docint-endpoint
          objectType: secret
        - |
          objectName: traduxai-docint-key
          objectType: secret
        - |
          objectName: traduxai-vision-pred-endpoint
          objectType: secret
        - |
          objectName: traduxai-vision-pred-key
          objectType: secret
        - |
          objectName: traduxai-language-endpoint
          objectType: secret
        - |
          objectName: traduxai-language-key
          objectType: secret
        - |
          objectName: traduxai-servicebus-connection
          objectType: secret
        - |
          objectName: traduxai-search-endpoint
          objectType: secret
        - |
          objectName: traduxai-search-key
          objectType: secret
        - |
          objectName: traduxai-storage-connection
          objectType: secret
  secretObjects:
    - secretName: traduxai-secrets
      type: Opaque
      data:
        - objectName: traduxai-postgres-url
          key: POSTGRES_URL
        - objectName: traduxai-appinsights
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: traduxai-keycloak-url
          key: KEYCLOAK_URL
        - objectName: traduxai-keycloak-issuer
          key: KEYCLOAK_ISSUER
        - objectName: traduxai-keycloak-client-secret
          key: KEYCLOAK_CLIENT_SECRET
        - objectName: traduxai-keycloak-client-secret
          key: KEYCLOAK_CLIENT_SECRET_API
        - objectName: traduxai-nextauth-secret
          key: NEXTAUTH_SECRET
        - objectName: traduxai-nextauth-secret
          key: AUTH_SECRET
        - objectName: traduxai-openai-endpoint
          key: AZURE_OPENAI_ENDPOINT
        - objectName: traduxai-openai-key
          key: AZURE_OPENAI_KEY
        - objectName: traduxai-translator-endpoint
          key: TRANSLATOR_ENDPOINT
        - objectName: traduxai-translator-key
          key: TRANSLATOR_KEY
        - objectName: traduxai-docint-endpoint
          key: DOCINT_ENDPOINT
        - objectName: traduxai-docint-endpoint
          key: DOCUMENT_INTELLIGENCE_ENDPOINT
        - objectName: traduxai-docint-key
          key: DOCINT_KEY
        - objectName: traduxai-docint-key
          key: DOCUMENT_INTELLIGENCE_KEY
        - objectName: traduxai-vision-pred-endpoint
          key: CUSTOM_VISION_PREDICTION_ENDPOINT
        - objectName: traduxai-vision-pred-key
          key: CUSTOM_VISION_PREDICTION_KEY
        - objectName: traduxai-language-endpoint
          key: LANGUAGE_ENDPOINT
        - objectName: traduxai-language-key
          key: LANGUAGE_KEY
        - objectName: traduxai-servicebus-connection
          key: SERVICEBUS_CONNECTION_STRING
        - objectName: traduxai-servicebus-connection
          key: SERVICE_BUS_CONNECTION_STRING
        - objectName: traduxai-search-endpoint
          key: SEARCH_ENDPOINT
        - objectName: traduxai-search-key
          key: SEARCH_KEY
        - objectName: traduxai-storage-connection
          key: STORAGE_CONNECTION_STRING
        - objectName: traduxai-storage-connection
          key: AZURE_STORAGE_CONNECTION_STRING

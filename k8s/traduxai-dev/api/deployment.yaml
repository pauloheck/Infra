apiVersion: apps/v1
kind: Deployment
metadata:
  name: traduxai-api
  namespace: traduxai-dev
  labels:
    app: traduxai-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: traduxai-api
  template:
    metadata:
      labels:
        app: traduxai-api
    spec:
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: traduxai-kv-secrets
      containers:
        - name: api
          image: acrheckiodev.azurecr.io/traduxai-api:latest
          ports:
            - containerPort: 8010
              name: http
          env:
            - name: ENVIRONMENT
              value: production
            - name: KEYCLOAK_REALM
              value: traduxai
            - name: TRANSLATOR_REGION
              value: eastus2
            - name: KEYCLOAK_URL
              value: http://keycloak.keycloak.svc.cluster.local:8080/auth
            - name: KEYCLOAK_ISSUER
              value: https://traduxai-heck.eastus2.cloudapp.azure.com/auth/realms/traduxai
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: traduxai-secrets
                  key: POSTGRES_URL
          envFrom:
            - secretRef:
                name: traduxai-secrets
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: traduxai-web
  namespace: traduxai-dev
  labels:
    app: traduxai-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: traduxai-web
  template:
    metadata:
      labels:
        app: traduxai-web
    spec:
      containers:
        - name: web
          image: acrheckiodev.azurecr.io/traduxai-web:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXTAUTH_URL
              value: https://traduxai-heck.eastus2.cloudapp.azure.com
            - name: NEXT_PUBLIC_API_URL
              value: https://traduxai-heck.eastus2.cloudapp.azure.com
            - name: TRADUXAI_API_URL
              value: http://traduxai-api.traduxai-dev.svc.cluster.local:8010
            - name: KEYCLOAK_URL
              value: http://keycloak.keycloak.svc.cluster.local:8080
            - name: KEYCLOAK_ISSUER
              value: https://traduxai-heck.eastus2.cloudapp.azure.com/auth/realms/traduxai
            - name: KEYCLOAK_CLIENT_ID
              value: traduxai-web
            - name: AUTH_TRUST_HOST
              value: "true"
          envFrom:
            - secretRef:
                name: traduxai-secrets
          readinessProbe:
            httpGet:
              path: /api/auth/providers
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
